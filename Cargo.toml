[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/imamachowdhury/muzn-download-manager"
authors = ["Imam Ahmed"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
futures-util = "0.3"
url = "2"
thiserror = "2"
tracing = "0.1"
percent-encoding = "2"
bytes = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# dev
axum = "0.7"
proptest = "1"
sha2 = "0.10"
tempfile = "3"
tokio-stream = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
